[package]
name = "goghmode"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[[bin]]
name = "goghmode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.34", default-features = true }
egui = "0.34"
hmac = "0.12"
home = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
