name: iOS TestFlight

# Triggers are deliberately limited to manual dispatch and version tags.
# This repository is public: a pull_request trigger would expose the signing
# secrets to any fork.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: macos-26
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Validate required secrets
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_BASE64 BUILD_CERTIFICATE_BASE64 P12_PASSWORD PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub secret $name is missing."
              missing=1
            fi
          done
          exit "$missing"

      # Runs before any credential is placed on disk, so a broken build fails
      # cheaply. Simulator builds need no signing.
      - name: Test on simulator
        working-directory: ipad-companion
        run: |
          # Resolve a simulator by UDID rather than hardcoding a device name —
          # runner images change their simulator lineup between releases.
          AVAILABLE=$(xcrun simctl list devices available)
          SIMULATOR_UDID=$(echo "$AVAILABLE" | grep 'iPad' | head -1 | grep -oE '[0-9A-F-]{36}')
          if [[ -z "$SIMULATOR_UDID" ]]; then
            SIMULATOR_UDID=$(echo "$AVAILABLE" | grep -oE '[0-9A-F-]{36}' | head -1)
          fi
          if [[ -z "$SIMULATOR_UDID" ]]; then
            echo "::error::No iOS simulator available on this runner."
            exit 1
          fi
          echo "Using simulator $SIMULATOR_UDID"
          xcodebuild test \
            -project GoghModeCompanion.xcodeproj \
            -scheme GoghModeCompanion \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILES_DIR/goghmode-companion.mobileprovision"

      - name: Place App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      # github.run_number is monotonic per repository, so every upload gets a
      # unique build number without committing a bumped value back to the repo.
      - name: Archive
        working-directory: ipad-companion
        run: |
          xcodebuild archive \
            -project GoghModeCompanion.xcodeproj \
            -scheme GoghModeCompanion \
            -destination 'generic/platform=iOS' \
            -archivePath build/GoghModeCompanion.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=3J7HD944C3 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="GoghMode Companion App Store"

      - name: Verify the app icon made it into the archive
        working-directory: ipad-companion
        run: |
          APP="build/GoghModeCompanion.xcarchive/Products/Applications/GoghModeCompanion.app"
          if ! ls "$APP"/AppIcon*.png >/dev/null 2>&1; then
            echo "::error::No app icon in the archive. App Store Connect will reject this build."
            exit 1
          fi

      - name: Export and upload to TestFlight
        working-directory: ipad-companion
        run: |
          xcodebuild -exportArchive \
            -archivePath build/GoghModeCompanion.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Cleanup secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/goghmode-companion.mobileprovision"
